<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MediKiosk — History</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/state.js"></script>
</head>
<body>
  <div class="screen">
    <h2>Tell us what's bothering you</h2>
    <!-- Ditya: replace with the branching question tree (chief complaint -> SOCRATES
         follow-ups -> past/drug/family/personal/ROS). Each question should be
         answerable by tapping a button OR speaking (Web Speech API — see below). -->
    <div class="card">
      <label>Chief complaint</label><br/>
      <input id="chiefComplaint" placeholder="e.g. chest pain" />
      <button onclick="listen('chiefComplaint')">🎤 Speak instead</button>
    </div>
    <button class="primary" onclick="submit()">Continue</button>
  </div>
  <script>
    // Minimal Web Speech API wiring — Ditya: expand per-question, add branching logic.
    function listen(fieldId) {
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) { alert('Speech recognition not supported in this browser'); return; }
      const rec = new Recognition();
      rec.lang = 'en-IN';
      rec.onresult = (e) => { document.getElementById(fieldId).value = e.results[0][0].transcript; };
      rec.start();
    }

    function submit() {
      updatePatient({
        history: {
          chiefComplaint: document.getElementById('chiefComplaint').value,
          hpi: '', pastHistory: '', drugAllergy: '', family: '', personal: '', ros: ''
        }
      });
      location.href = '../module-b-documents/index.html';
    }
  </script>
</body>
</html>
