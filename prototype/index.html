<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>MediKiosk - Welcome</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Add any shared styles just in case -->
  <link rel="stylesheet" href="shared/style.css" />

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class", 
      theme: {
        extend: {
          colors: {
            "primary-fixed": "#ccebc2", "surface-container-low": "#faf2ec", "outline-variant": "#c3c8bd", "tertiary-container": "#e5b1b5", 
            "surface-container-lowest": "#ffffff", "surface-container-high": "#efe7e1", tertiary: "#7c5357", "secondary-fixed-dim": "#ffb599", 
            "surface-variant": "#e9e1db", "surface-container-highest": "#e9e1db", "on-tertiary-container": "#694246", surface: "#fff8f4", 
            "surface-bright": "#fff8f4", outline: "#73796f", "on-tertiary-fixed-variant": "#623c40", "on-primary-fixed-variant": "#334d2f", 
            "on-primary": "#ffffff", "surface-container": "#f4ece6", "on-secondary": "#ffffff", "on-error-container": "#93000a", 
            "surface-dim": "#e0d9d3", error: "#ba1a1a", background: "#fff8f4", "on-secondary-fixed": "#370e00", "surface-tint": "#4a6545", 
            "on-secondary-fixed-variant": "#6e3822", "inverse-surface": "#33302c", "secondary-fixed": "#ffdbce", "on-tertiary-fixed": "#301216", 
            "secondary-container": "#ffb193", "primary-container": "#a8c69f", "on-background": "#1e1b18", "inverse-on-surface": "#f7efe9", 
            "on-primary-fixed": "#082007", "on-primary-container": "#395334", "on-tertiary": "#ffffff", primary: "#4a6545", 
            "on-secondary-container": "#7a412a", "tertiary-fixed-dim": "#eeb9bd", "tertiary-fixed": "#ffdadc", "on-surface-variant": "#434840", 
            "primary-fixed-dim": "#b1cfa7", secondary: "#8a4f37", "inverse-primary": "#b1cfa7", "on-surface": "#1e1b18", "error-container": "#ffdad6", 
            "on-error": "#ffffff"
          }, 
          borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, 
          spacing: {"margin-mobile": "24px", unit: "8px", "card-padding": "32px", gutter: "24px", "stack-gap": "16px", "margin-desktop": "64px"}, 
          fontFamily: {
            "headline-md": ["Noto Serif"], "label-lg": ["Plus Jakarta Sans"], "display-lg": ["Noto Serif"], "display-lg-mobile": ["Noto Serif"], 
            "headline-sm": ["Noto Serif"], "label-sm": ["Plus Jakarta Sans"], "body-lg": ["Noto Serif"], "body-md": ["Noto Serif"], 
            headline: ["Noto Serif"], display: ["Noto Serif"], body: ["Noto Serif"], label: ["Plus Jakarta Sans"]
          }, 
          fontSize: {
            "headline-md": ["32px", {lineHeight: "40px", fontWeight: "600"}], "label-lg": ["16px", {lineHeight: "24px", letterSpacing: "0.05em", fontWeight: "600"}], 
            "display-lg": ["48px", {lineHeight: "60px", letterSpacing: "-0.02em", fontWeight: "700"}], "display-lg-mobile": ["36px", {lineHeight: "44px", fontWeight: "700"}], 
            "headline-sm": ["24px", {lineHeight: "32px", fontWeight: "600"}], "label-sm": ["14px", {lineHeight: "20px", fontWeight: "500"}], 
            "body-lg": ["20px", {lineHeight: "30px", fontWeight: "400"}], "body-md": ["18px", {lineHeight: "28px", fontWeight: "400"}]
          }
        }
      }
    };
  </script>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-[#F5F1E8] pt-safe pb-safe">
  <main class="flex-1">
    <div class="flex flex-col w-full min-h-full px-margin-mobile pb-margin-desktop gap-stack-gap relative overflow-hidden">
      <!-- Hero Illustration -->
      <div class="w-full aspect-[4/3] max-h-[300px] rounded-[8px] bg-surface-container shadow-sm flex items-center justify-center overflow-hidden shrink-0 mt-margin-mobile relative">
        <img class="w-full h-full object-cover absolute inset-0 z-0" alt="A warm, approachable AI medical assistant in a modern Indian hospital setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcqjQTrvBcIKh_BWzIZp5qymIT9dItjV1Gk9ky0-mHCfgZV8VKYrRaSshzg2gVOmbne2pgCZBAMJSXefdRYZQOVHMpY30E_6YX4eQE_nhcnZLzmlW9Z8efuADasr2zdLE4k7iEvnhrmdjSeKMp78j9_LROo1PkVYBfMttB2OXE_GLk3SkwDV_iZQfprenQrO9v5owSi6DaEFn4X90sbfzABhyyciIiNgS5z7-OgFLa__C3Q2bl1PI7"/>
        <!-- Ambient overlay for depth -->
        <div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/80 to-transparent z-10"></div>
      </div>
      
      <!-- Header & Audio Prompt -->
      <div class="flex flex-col gap-unit items-center text-center relative z-20 -mt-stack-gap">
        <h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface drop-shadow-sm">
            Welcome / स्वागत है
        </h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">
            Please select your preferred language to begin.
        </p>
        
        <!-- Audio Button -->
        <button class="mt-unit h-[56px] px-6 rounded-[8px] bg-[#A8C69F] text-[#3E3A36] flex items-center gap-2 shadow-md relative overflow-hidden group active:scale-95 transition-transform touch-manipulation" id="audio-prompt-btn">
          <div class="absolute inset-0 bg-white/20 rounded-[8px] opacity-0" id="audio-pulse"></div>
          <span class="material-symbols-outlined relative z-10 text-[28px] text-[#8C8680]" style="font-variation-settings: 'FILL' 1;">volume_up</span>
          <span class="relative z-10 font-label-lg text-label-lg whitespace-nowrap">Listen to Instructions</span>
        </button>
      </div>
      
      <!-- Language Selection Grid -->
      <div class="flex flex-col gap-unit w-full" id="language-grid">
        <!-- English -->
        <button class="lang-btn w-full h-[80px] bg-primary-container shadow-md rounded-[8px] flex items-center px-gutter gap-gutter text-left transition-all active:scale-[0.98] touch-manipulation border border-[#D9D3CC]" data-selected="true" data-lang="en">
          <div class="w-[48px] h-[48px] shrink-0 rounded-[8px] bg-surface-container-lowest flex items-center justify-center text-[24px] shadow-sm">
                A
          </div>
          <div class="flex flex-col flex-1 min-w-0">
            <span class="font-headline-md text-headline-md text-on-primary-container truncate">English</span>
          </div>
          <span class="material-symbols-outlined text-primary shrink-0 selection-icon" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        </button>
        
        <!-- Hindi -->
        <button class="lang-btn w-full h-[80px] bg-[#FFFCF5] border border-[#D9D3CC] shadow-sm rounded-[8px] flex items-center px-gutter gap-gutter text-left transition-all active:scale-[0.98] touch-manipulation" data-selected="false" data-lang="hi">
          <div class="w-[48px] h-[48px] shrink-0 rounded-[8px] bg-surface-container-low flex items-center justify-center text-[24px]">
                अ
          </div>
          <div class="flex flex-col flex-1 min-w-0">
            <span class="font-headline-md text-headline-md text-on-surface truncate">हिन्दी</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant truncate">Hindi</span>
          </div>
          <span class="material-symbols-outlined text-[#8C8680] shrink-0 selection-icon">chevron_right</span>
        </button>
        
        <!-- Punjabi -->
        <button class="lang-btn w-full h-[80px] bg-[#FFFCF5] border border-[#D9D3CC] shadow-sm rounded-[8px] flex items-center px-gutter gap-gutter text-left transition-all active:scale-[0.98] touch-manipulation" data-selected="false" data-lang="pa">
          <div class="w-[48px] h-[48px] shrink-0 rounded-[8px] bg-surface-container-low flex items-center justify-center text-[24px]">
                ੳ
          </div>
          <div class="flex flex-col flex-1 min-w-0">
            <span class="font-headline-md text-headline-md text-on-surface truncate">ਪੰਜਾਬੀ</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant truncate">Punjabi</span>
          </div>
          <span class="material-symbols-outlined text-[#8C8680] shrink-0 selection-icon">chevron_right</span>
        </button>
        
        <!-- Tamil -->
        <button class="lang-btn w-full h-[80px] bg-[#FFFCF5] border border-[#D9D3CC] shadow-sm rounded-[8px] flex items-center px-gutter gap-gutter text-left transition-all active:scale-[0.98] touch-manipulation" data-selected="false" data-lang="ta">
          <div class="w-[48px] h-[48px] shrink-0 rounded-[8px] bg-surface-container-low flex items-center justify-center text-[24px]">
                அ
          </div>
          <div class="flex flex-col flex-1 min-w-0">
            <span class="font-headline-md text-headline-md text-on-surface truncate">தமிழ்</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant truncate">Tamil</span>
          </div>
          <span class="material-symbols-outlined text-[#8C8680] shrink-0 selection-icon">chevron_right</span>
        </button>
      </div>
      
      <!-- Bottom Actions & Consent -->
      <div class="flex flex-col gap-stack-gap mt-auto pt-stack-gap w-full">
        <p class="text-center font-body-md text-body-md text-on-surface-variant px-4">
            By proceeding, you agree to our <button class="text-primary font-bold active:opacity-70">consent guidelines</button>.
        </p>
        <button onclick="saveLanguageAndProceed()" class="w-full h-[64px] bg-[#A8C69F] text-[#3E3A36] rounded-[8px] flex items-center justify-center gap-2 shadow-md active:shadow-sm active:scale-[0.99] transition-all touch-manipulation">
          <span class="font-headline-md text-headline-md">Start / शुरू करें</span>
          <span class="material-symbols-outlined text-[28px] text-[#3E3A36]" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
        </button>
      </div>
    </div>

    <script>
      // Audio Button Pulse Animation
      const audioBtn = document.getElementById('audio-prompt-btn');
      const audioPulse = document.getElementById('audio-pulse');
      
      audioBtn.addEventListener('click', () => {
          audioPulse.classList.remove('opacity-0');
          audioPulse.animate([
              { transform: 'scale(1)', opacity: 0.5 },
              { transform: 'scale(1.5)', opacity: 0 }
          ], {
              duration: 800,
              easing: 'ease-out',
              iterations: 2
          }).onfinish = () => audioPulse.classList.add('opacity-0');
      });

      // Language Selection Logic
      const langBtns = document.querySelectorAll('.lang-btn');
      let selectedLang = 'en'; // default
      
      langBtns.forEach(btn => {
          btn.addEventListener('click', () => {
              // Reset all buttons
              langBtns.forEach(b => {
                  b.setAttribute('data-selected', 'false');
                  b.className = 'lang-btn w-full h-[80px] bg-[#FFFCF5] border border-[#D9D3CC] shadow-sm rounded-[8px] flex items-center px-gutter gap-gutter text-left transition-all active:scale-[0.98] touch-manipulation';
                  
                  // Reset text colors
                  const mainText = b.querySelector('.font-headline-md');
                  if(mainText) mainText.className = 'font-headline-md text-headline-md text-on-surface truncate';
                  
                  // Reset icon
                  const icon = b.querySelector('.selection-icon');
                  if(icon) {
                      icon.className = 'material-symbols-outlined text-[#8C8680] shrink-0 selection-icon';
                      icon.textContent = 'chevron_right';
                      icon.style.fontVariationSettings = "'FILL' 0";
                  }
              });

              // Set active state for clicked button
              btn.setAttribute('data-selected', 'true');
              selectedLang = btn.getAttribute('data-lang');
              btn.className = 'lang-btn w-full h-[80px] bg-primary-container shadow-md rounded-[8px] flex items-center px-gutter gap-gutter text-left transition-all active:scale-[0.98] touch-manipulation border border-[#D9D3CC]';
              
              // Update text color for active background
              const activeMainText = btn.querySelector('.font-headline-md');
              if(activeMainText) activeMainText.className = 'font-headline-md text-headline-md text-on-primary-container truncate';
              
              // Update icon
              const activeIcon = btn.querySelector('.selection-icon');
              if(activeIcon) {
                  activeIcon.className = 'material-symbols-outlined text-primary shrink-0 selection-icon';
                  activeIcon.textContent = 'check_circle';
                  activeIcon.style.fontVariationSettings = "'FILL' 1";
              }
          });
      });

      // Handle proceeding to next screen
      function saveLanguageAndProceed() {
          // Store selected language in localStorage for other modules to use
          localStorage.setItem('preferredLanguage', selectedLang);
          // Navigate to the Consent module as defined in the flow
          location.href = 'module-d-consent/index.html';
      }
    </script>
  </main>
</body>
</html>
