<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MediKiosk — Consent</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/state.js"></script>
</head>
<body>
  <div class="screen">
    <h2>Identify & Consent</h2>
    <!-- Sparsh: replace with ABHA ID entry/scan mock + audio-explain button -->
    <div class="card">
      <label>ABHA ID (mock)</label><br/>
      <input id="abhaId" placeholder="14-2025-xxxx-xxxx" />
    </div>
    <div class="card">
      <label><input type="checkbox" id="consentBox" /> I consent to share my health data</label>
    </div>
    <button class="primary" onclick="submit()">Continue</button>
  </div>
  <script>
    function submit() {
      const granted = document.getElementById('consentBox').checked;
      if (!granted) { alert('Consent required to continue'); return; }
      updatePatient({ consent: { granted: true, abhaId: document.getElementById('abhaId').value } });
      location.href = '../module-a-history/index.html';
    }
  </script>
</body>
</html>
