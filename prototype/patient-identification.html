<div class="w-full flex items-center justify-between mb-stack-md pt-stack-sm">
<div class="flex-1 mr-4">
<div class="h-2 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/4 rounded-full transition-all duration-300"></div>
</div>
</div>
<span class="font-label-sm text-on-surface-variant whitespace-nowrap">Step 1 of 4</span>
</div>
<!-- Page Title -->
<div class="mb-stack-lg text-center flex flex-col items-center">
<h1 class="font-headline-lg-mobile text-on-background mb-2">Patient Identification</h1>
<p class="font-body-md text-on-surface-variant max-w-[280px]">Scan ABHA QR code or enter number manually.</p>
<button aria-label="Listen to instructions" class="mt-4 h-12 px-6 rounded-full bg-primary text-on-primary flex items-center justify-center gap-2 font-label-lg shadow-md audio-pulse active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[#3E3A36]">volume_up</span>
<span>Listen</span>
</button>
</div>
<!-- Main Content Area -->
<div class="flex flex-col gap-stack-lg">
<!-- Scanner Section -->
<div class="bg-surface-container-lowest border border-[#D9D3CC] rounded-xl shadow-sm p-stack-md flex flex-col items-center">
<div class="w-48 h-48 bg-surface-variant rounded-lg relative overflow-hidden mb-stack-md">
<!-- Decorative Corner Markers for Scanner -->
<div class="absolute top-2 left-2 w-6 h-6 border-t-2 border-l-2 border-primary"></div>
<div class="absolute top-2 right-2 w-6 h-6 border-t-2 border-r-2 border-primary"></div>
<div class="absolute bottom-2 left-2 w-6 h-6 border-b-2 border-l-2 border-primary"></div>
<div class="absolute bottom-2 right-2 w-6 h-6 border-b-2 border-r-2 border-primary"></div>
<!-- Scanning Line Animation -->
<div class="w-full h-0.5 bg-primary absolute left-0 top-0 opacity-50 scanner-line"></div>
<div class="w-full h-full flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[48px] mb-2 opacity-50 text-[#8C8680]">qr_code_scanner</span>
<span class="font-label-sm text-center px-4">Align QR code within frame</span>
</div>
</div>
<button class="w-full h-[56px] rounded-lg bg-surface-container-highest text-on-surface flex items-center justify-center gap-2 font-label-lg active:bg-surface-dim transition-colors">
<span class="material-symbols-outlined text-[24px] text-[#8C8680]">flip_camera_ios</span>
                 Switch Camera
            </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 w-full">
<div class="h-px bg-surface-variant flex-1"></div>
<span class="font-label-sm text-on-surface-variant uppercase tracking-wider">OR</span>
<div class="h-px bg-surface-variant flex-1"></div>
</div>
<!-- Manual Input Section -->
<div class="bg-surface-container-lowest border border-[#D9D3CC] rounded-xl shadow-sm p-stack-md flex flex-col gap-stack-md">
<div class="flex flex-col gap-2">
<label class="font-label-lg text-on-background" for="abha-input">ABHA Number</label>
<div class="relative w-full">
<input class="w-full h-[64px] bg-surface-container-low text-on-surface font-headline-md px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" id="abha-input" inputmode="numeric" maxlength="14" pattern="[0-9]*" placeholder="00-0000-0000-0000" type="text"/>
<button aria-label="Clear input" class="absolute right-4 top-1/2 -translate-y-1/2 text-primary opacity-0 pointer-events-none transition-opacity" id="clear-input">
<span class="material-symbols-outlined text-[24px] text-[#D48C70]">cancel</span>
</button>
</div>

<div class="flex flex-col gap-stack-sm mt-2">
<button class="w-full h-[56px] rounded-lg bg-primary text-on-primary flex items-center justify-center gap-2 font-label-lg shadow-md active:bg-on-primary-fixed-variant transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="" id="submit-abha">
<span>Proceed</span>
<span class="material-symbols-outlined text-[#3E3A36]">arrow_forward</span>
</button>

                     Aadhaar Auth

</div>

<!-- Consent Toggle -->
<div class="bg-surface-container-low rounded-xl p-4 flex items-start gap-4">
<div class="relative inline-flex items-center cursor-pointer mt-1">
<input checked="" class="sr-only peer" id="consent-toggle" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
<div class="flex flex-col gap-1 flex-1">
<label class="font-label-lg text-on-background cursor-pointer" for="consent-toggle">Data Sharing Consent</label>
<p class="font-body-md text-on-surface-variant text-sm">I agree to share my health records with this facility for treatment purposes.</p>
</div>
<button aria-label="Listen to consent terms" class="w-10 h-10 rounded-full bg-primary/10 text-primary flex items-center justify-center shrink-0 audio-pulse mt-1">
<span class="material-symbols-outlined text-[20px] text-[#D48C70]">volume_up</span>
</button>
</div>
<!-- Register Link -->
<div class="text-center pb-stack-lg pt-stack-sm">
<button class="font-label-lg text-primary underline underline-offset-4 active:text-[#D48C70] transition-colors">
                Register New Patient
             </button>
</div>
</div>

<style>
    .scanner-line {
        animation: scan 2s linear infinite;
    }
    @keyframes scan {
        0% { transform: translateY(0); }
        50% { transform: translateY(180px); }
        100% { transform: translateY(0); }
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const abhaInput = document.getElementById('abha-input');
        const clearBtn = document.getElementById('clear-input');
        const submitBtn = document.getElementById('submit-abha');

        // Simple formatting for ABHA number (assuming 14 digits)
        abhaInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
            
            // Format as XX-XXXX-XXXX-XXXX
            let formattedValue = '';
            if (value.length > 0) {
                formattedValue = value.substring(0, 2);
            }
            if (value.length > 2) {
                formattedValue += '-' + value.substring(2, 6);
            }
            if (value.length > 6) {
                formattedValue += '-' + value.substring(6, 10);
            }
            if (value.length > 10) {
                formattedValue += '-' + value.substring(10, 14);
            }
            
            e.target.value = formattedValue;

            // Toggle clear button
            if (e.target.value.length > 0) {
                clearBtn.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                clearBtn.classList.add('opacity-0', 'pointer-events-none');
            }

            // Enable submit button if full length (14 digits + 3 dashes = 17 chars)
            if (e.target.value.length === 17) {
                submitBtn.removeAttribute('disabled');
            } else {
                submitBtn.setAttribute('disabled', 'true');
            }
        });

        clearBtn.addEventListener('click', () => {
            abhaInput.value = '';
            clearBtn.classList.add('opacity-0', 'pointer-events-none');
            submitBtn.setAttribute('disabled', 'true');
            abhaInput.focus();
        });
    });
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl pb-safe shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-[#D48C70] font-bold"><div class="flex justify-around items-center h-20"><a aria-current="page" class="flex flex-col items-center justify-center gap-1 min-w-[touch-target-min] transition-colors text-[#D48C70] font-bold" data-path="home" href="#"><span class="material-symbols-outlined text-[28px]">home</span><span class="font-label-sm text-label-sm">Home</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[touch-target-min] text-[#8C8680] hover:text-[#D48C70] transition-colors" data-path="documents" href="#"><span class="material-symbols-outlined text-[28px]">description</span><span class="font-label-sm text-label-sm">Documents</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[touch-target-min] text-[#8C8680] hover:text-[#D48C70] transition-colors" data-path="profile" href="#"><span class="material-symbols-outlined text-[28px]">account_circle</span><span class="font-label-sm text-label-sm">Profile</span></a></div></nav></body></html>
