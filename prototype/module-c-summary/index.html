<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MediKiosk — Physician Summary</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/state.js"></script>
<script src="../shared/sample-data.js"></script>
</head>
<body>
  <div class="screen">
    <h2>Physician-Ready Summary</h2>
    <!-- Vansh: this is the glue step. Take patient.history (Module A) and
         patient.documents (Module B) and template-fill the sections below.
         No real AI needed for the demo — just slot the fields in. -->
    <button onclick="loadSample()">Load sample data (dev only, stands in for A + B)</button>
    <div class="card" id="summary"></div>
    <button class="primary" onclick="confirmSummary()">Confirm & Save</button>
    <p id="confirmMsg"></p>
  </div>
  <script>
    const FIELDS = [
      ['chiefComplaint', 'Chief Complaint'],
      ['hpi', 'HPI'],
      ['pastHistory', 'Past Medical/Surgical'],
      ['drugAllergy', 'Drug & Allergy'],
      ['family', 'Family'],
      ['personal', 'Personal'],
      ['ros', 'Review of Systems']
    ];

    function render() {
      const patient = getPatient();
      const h = patient.history || {};
      const docs = patient.documents || [];

      document.getElementById('summary').innerHTML = `
        ${FIELDS.map(([key, label]) => `
          <p><strong>${label}:</strong>
            <span contenteditable="true" data-field="${key}">${h[key] || ''}</span>
          </p>
        `).join('')}
        <p><strong>Prior Documents:</strong> ${docs.length} scanned</p>
        ${docs.map(d => `<pre>${d.extractedText}</pre>`).join('')}
      `;
      document.getElementById('confirmMsg').textContent = '';
    }

    function confirmSummary() {
      const history = {};
      document.querySelectorAll('[data-field]').forEach(el => {
        history[el.dataset.field] = el.textContent.trim();
      });
      updatePatient({ history, summaryConfirmed: true });
      document.getElementById('confirmMsg').textContent = 'Saved — physician has confirmed this history.';
    }

    function loadSample() {
      updatePatient(SAMPLE_PATIENT);
      render();
    }

    render();
  </script>
</body>
</html>
